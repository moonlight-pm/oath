[workspace]
resolver = "2"
members = [
    "crates/oath-core",
    "crates/oath",
    "crates/oath-init",
    "crates/oath-make",
    "crates/oath-efi",
]
default-members = [
    "crates/oath-core",
    "crates/oath",
    "crates/oath-init",
    "crates/oath-make",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
