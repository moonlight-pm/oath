[workspace]
resolver = "2"
members = [
    "crates/oath-core",
    "crates/oath",
    "crates/oath-init",
    "crates/oath-make",
    "crates/oath-efi",
]
default-members = [
    "crates/oath-core",
    "crates/oath",
    "crates/oath-init",
    "crates/oath-make",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# oath-make hashes gigabytes of sources (sha256 pins, upstream signatures)
# under `cargo make`, a dev build: optimize the hash and bignum crates.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
