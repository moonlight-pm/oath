[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

# Host build CLI (xtask-style). `cargo make build|run|up|start|stop|probe` runs oath-make.
# Bare `cargo make` prints the tool help. `cargo make --help` is Cargo's alias help.
[alias]
make = ["run", "--package", "oath-make", "--"]
