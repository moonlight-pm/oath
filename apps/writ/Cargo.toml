# writ, Oath's coding agent (R64). Rust's standard library only, so nothing to pin but
# pkg:rust: what the kernel offers is declared by hand in src/sys.rs.
[package]
name = "writ"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace, not a member of the OS's.
[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
