[package]
name = "oath-init"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oath-init"
path = "src/main.rs"

[[bin]]
name = "serial-login"
path = "src/bin/serial-login.rs"

[[bin]]
name = "screen-login"
path = "src/bin/screen-login.rs"

[[bin]]
name = "sudo"
path = "src/bin/sudo.rs"

[[bin]]
name = "login"
path = "src/bin/login.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
oath-core = { path = "../oath-core" }
nix = { version = "0.30", default-features = false, features = [
    "fs",
    "mount",
    "hostname",
    "reboot",
    "process",
    "signal",
    "ioctl",
    "term",
    "kmod",
] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[dev-dependencies]
tempfile = "3"
