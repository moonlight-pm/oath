[package]
name = "oath-init"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oath-init"
path = "src/main.rs"

[[bin]]
name = "serial-login"
path = "src/bin/serial-login.rs"

[[bin]]
name = "sudo"
path = "src/bin/sudo.rs"

[dependencies]
oath-core = { path = "../oath-core" }
nix = { version = "0.30", default-features = false, features = [
    "fs",
    "mount",
    "hostname",
    "reboot",
    "process",
    "signal",
    "ioctl",
    "term",
] }
libc = "0.2"
png = "0.17"
serde_json = "1"
