# Oath boot: compositor only. Bar is svc:omarchy-shell (Quickshell), not exec-once.
# Omarchy's default/hypr is Lua (Hyprland ≥0.56); packed Hyprland is 0.52 conf.
monitor=,preferred,auto,1
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
debug {
    disable_logs = false
}
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, E, exit,
