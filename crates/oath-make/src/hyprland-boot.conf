# Oath Hyprland 0.52 desk. Bar is svc:omarchy-shell.
# exec-once only applies the Yaru XCursor (the wrapper also exports it).
# Omarchy's default/hypr is Lua (Hyprland ≥0.56); this conf ports tiling
# plus Super+Return / Super+Space / Super+K / Print / Super+Shift+Return so the desk is usable.
monitor=,preferred,auto,1

env = OMARCHY_PATH,/oath/store/pkg/omarchy
env = XDG_DATA_DIRS,/oath/store/pkg/omarchy:/oath/store/pkg/omarchy/share:/oath/store/pkg/foot/share:/oath/store/pkg/sola/share
env = XCURSOR_THEME,Yaru
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_PATH,/oath/store/pkg/omarchy/share/icons
env = FONTCONFIG_FILE,/oath/store/pkg/quickshell/etc/fonts/fonts.conf

exec-once = hyprctl setcursor Yaru 24

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

debug {
    disable_logs = false
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    repeat_rate = 40
    repeat_delay = 250
    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Close / float / fullscreen (Omarchy: Super+W closes, not Super+Q).
# bindd so Super+K (omarchy-menu-keybindings) can show descriptions.
bindd = SUPER, W, Close window, killactive,
bindd = SUPER, T, Toggle window floating, togglefloating,
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER, J, Toggle window split, layoutmsg, togglesplit
bindd = SUPER, P, Pop window, pseudo,

# Focus
bindd = SUPER, left, Focus left, movefocus, l
bindd = SUPER, right, Focus right, movefocus, r
bindd = SUPER, up, Focus up, movefocus, u
bindd = SUPER, down, Focus down, movefocus, d
bindd = ALT, Tab, Cycle to next window, cyclenext,
bindd = ALT SHIFT, Tab, Cycle to previous window, cyclenext, prev

# Swap
bindd = SUPER SHIFT, left, Swap window left, swapwindow, l
bindd = SUPER SHIFT, right, Swap window right, swapwindow, r
bindd = SUPER SHIFT, up, Swap window up, swapwindow, u
bindd = SUPER SHIFT, down, Swap window down, swapwindow, d

# Workspaces 1–10
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# Mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Apps — Omarchy chords; binaries are Oath packs / shims.
bindd = SUPER, Return, Terminal, exec, /bin/omarchy-launch-terminal
bindd = SUPER SHIFT, Return, Browser, exec, /bin/sola-browser
bindd = SUPER, SPACE, Omarchy menu, exec, /lib/oath/omarchy-menu-toggle
bindd = SUPER ALT, SPACE, Apps menu, exec, /lib/oath/omarchy-menu-toggle apps
bindd = SUPER, K, Keybindings, exec, /oath/store/pkg/omarchy/bin/omarchy-menu-keybindings
# Capture — Omarchy defaults (manual/screenshots-recording, coming-from-mac).
# No Print key (Mac): Super+Ctrl+C. Super+Shift+N stays move-to-workspace.
bindd = SUPER CTRL, C, Capture menu, exec, /lib/oath/omarchy-menu-toggle capture
bindd = , Print, Screenshot, exec, /oath/store/pkg/omarchy/bin/omarchy-capture-screenshot
bindd = SUPER, Print, Color picker, exec, hyprpicker -a
