[package]
name = "oath-efi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "oath_efi"
path = "src/lib.rs"

[[bin]]
name = "oath-efi"
path = "src/main.rs"
required-features = ["uefi-app"]

[features]
default = []
uefi-app = ["dep:uefi"]

[dependencies]
uefi = { version = "0.35", optional = true, features = ["alloc", "global_allocator", "panic_handler"] }

[build-dependencies]
png = "0.17"
