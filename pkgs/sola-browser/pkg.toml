# From the same tree and crates as pkg:sola. cef/ links to pkg:cef, where
# the browser looks beside its prefix; libcef.so is found by the RUNPATH
# Sola's build bakes in, which names pkg:cef's slot.
version = "0.1.0"
license = "LicenseRef-Sola"
description = "Sola's browser: iced chrome on CEF."
home = "https://github.com/moonlight-pm/Sola"
tree = "forks/sola"
build = ["rust", "pkgconf", "sola-crates", "cef"]
run = ["sola", "cef"]
