# GitHub CLI: the vendor's Linux build (R7), a static Go executable, from
# the repository's GitHub releases, pinned by sha256. GitHub publishes an
# unsigned checksums list and, through its API, Sigstore attestations
# (DSSE, SLSA provenance) that oath-make does not check yet. The licence
# is gh's and the Go modules it links (go.mod). gh reads curl's CA bundle
# (pkg:curl), since Go looks for one only under /etc.
version = "2.103.3"
license = "MIT AND BSD-3-Clause AND BSD-2-Clause AND Apache-2.0 AND MPL-2.0"
description = "GitHub CLI: GitHub's pull requests, issues, releases and API from the terminal."
home = "https://cli.github.com/"
purl = "pkg:golang/github.com/cli/cli/v2@2.103.3"
build = []
run = ["curl"]

[[source]]
url = "https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz"
sha256 = "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d"
unsigned = "gh's checksums list is unsigned, and its release attestations (Sigstore DSSE through GitHub's API) are a format oath-make does not check yet"
