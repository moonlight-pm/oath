# GitHub CLI, built from its tag's tree with the modules below (R49), so Go's
# fixes and pkg:certs' roots reach it. GitHub's tags are unsigned, and its
# attestations cover only its own binaries. Re-pin with:
#   pkgs/go-modules.sh gh ./cmd/gh
version = "2.103.3"
license = "MIT AND BSD-3-Clause AND BSD-2-Clause AND Apache-2.0 AND MPL-2.0 AND ISC"
description = "GitHub CLI: GitHub's pull requests, issues, releases and API from the terminal."
home = "https://cli.github.com/"
category = "toolchain"
purl = "pkg:golang/github.com/cli/cli/v2@2.103.3"
build = ["go"]
run = ["certs"]
unsigned = "GitHub's tags are unsigned; its modules come from proxy.golang.org, and the go command checks each against go.sum in the build"

