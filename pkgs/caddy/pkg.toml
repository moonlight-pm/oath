# Caddy, the web server with automatic TLS, from the release's buildable
# artifact: its main package and go.mod, with the modules below in place of
# its vendor/, since a module's fix may not wait for a release (R49). Caddy
# signs it with a keyless cosign .pem and .sig, not the bundle oath-make
# reads; when this was pinned (2026-11-01) the signature was checked by hand
# against the Fulcio certificate of Caddy's release workflow, and the sha512
# against its checksums list. Built with the tags its own releases use. The
# roots are pkg:certs'; ACME's state goes under the service's $HOME or XDG
# directories. Re-pin with:
#   pkgs/go-modules.sh --tags 'nobadger nomysql nopgx' caddy .
version = "2.11.7"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND CC0-1.0"
description = "Caddy: the web server and reverse proxy with automatic HTTPS."
home = "https://caddyserver.com/"
purl = "pkg:golang/github.com/caddyserver/caddy/v2@2.11.7"
build = ["go"]
run = ["certs"]
unsigned = "Caddy signs with a cosign .pem and .sig (keyless, no bundle), which oath-make does not read; checked by hand when pinned. Its modules come from proxy.golang.org, and the go command checks each against go.sum in the build"

