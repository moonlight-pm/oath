# Every crate Sola's Cargo.lock names (crates.io and git), from `cargo
# vendor` on the build host, so pkg:sola builds offline. Windows-only
# crates keep only their manifests. Each crate keeps its own licence. A
# build tool; not in an image.
version = "2026.10.18"
license = "LicenseRef-Cargo-Crates"
description = "The vendored crates of forks/sola's Cargo.lock."
home = "https://github.com/moonlight-pm/oath-sola"
cargo_vendor = "forks/sola"
build = []
