# protoc, the Protocol Buffers compiler, with Abseil, the version protobuf's
# own build names, built into it. A build tool: netavark generates its DHCP
# proxy's gRPC code with it. Neither release is signed (protobuf's attestation
# covers only its Bazel archive).
version = "36.2"
license = "BSD-3-Clause AND Apache-2.0"
description = "protoc: the Protocol Buffers compiler."
home = "https://protobuf.dev/"
purl = "pkg:github/protocolbuffers/protobuf@v36.2"
build = ["cmake", "ninja"]
run = ["gcc"]
unsigned = "protobuf and Abseil publish these tarballs without signatures"

