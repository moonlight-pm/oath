# The C library for 32-bit x86 (i386) programs: glibc 2.44 from the same
# pinned tarball as pkg:glibc (R17: one glibc, built for two ABIs), for
# Steam's 32-bit launcher and 32-bit games (R29). Its libraries are in
# lib32/ and its loader is lib32/ld-linux.so.2, so a machine's /lib never
# links them: only a build sandbox and Steam's sandbox show them, at
# /lib32 and /lib/ld-linux.so.2. The headers are pkg:glibc's (x86's are
# bi-arch) but for gnu/stubs-32.h and gnu/lib-names-32.h.
version = "2.44"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later AND GPL-2.0-only WITH Linux-syscall-note"
description = "glibc for i386 programs: lib32/ and the loader ld-linux.so.2."
home = "https://www.gnu.org/software/libc/"
purl = "pkg:generic/glibc@2.44"
build = ["python", "bison", "gmp", "mpfr", "mpc"]

[[source]]
url = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"
sig = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz.sig"
key = "glibc"

# Same pinned tarball as pkgs/linux; only the UAPI headers are used.
[[source]]
url = "https://git.kernel.org/torvalds/t/linux-7.3-rc1.tar.gz"
sha256 = "8d36fbfc7c8906ccfa1ebacc30f84998406504c3f13733a040bb3a3fbe8ac270"
unsigned = "a cgit snapshot of Linus's signed tag; rc tarballs are not signed"

# pkg:gcc's tarball: a C compiler built here only for its 32-bit libgcc,
# which glibc links and an x86_64-only compiler does not have.
[[source]]
url = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
sig = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz.sig"
key = "gcc"
