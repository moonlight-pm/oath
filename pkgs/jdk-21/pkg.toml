# Java 21, the development kit: Eclipse Temurin's build of OpenJDK, the
# vendor's release (R7), pinned by sha256 and checked against the signature
# Adoptium publishes beside it (pkgs/keys/adoptium.asc). A build tool, for
# programs with Java parts (Prism Launcher's); machines run pkg:jre-21. The
# tree is in libexec/jdk-21/, and its programs are pointed at /lib's loader
# (R17), as pkg:jre-21's are.
version = "21.0.13+9"
license = "GPL-2.0-only WITH Classpath-exception-2.0 AND FTL AND MIT AND IJG AND Libpng AND Zlib AND Unicode-3.0 AND Apache-2.0 AND BSD-3-Clause AND MPL-2.0"
description = "Java 21's JDK: Eclipse Temurin's OpenJDK, with javac and jar, in libexec/jdk-21."
home = "https://adoptium.net/"
category = "toolchain"
purl = "pkg:generic/temurin-jdk@21.0.13%2B9"
build = ["patchelf"]
run = ["alsa-lib", "libx11", "libxext", "libxi", "libxrender", "libxtst"]

