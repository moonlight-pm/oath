# cell, Oath's own container runner, from apps/cell: pull an image, unpack it, run it
# over crun and pasta, in the foreground, with one uid (R53, R59). Go's standard library
# only, so nothing to pin but pkg:go. zstd is the one layer format Go cannot read.
version = "0.1.0"
license = "MIT"
description = "cell: run a container image over crun and pasta, with one uid and no daemon."
home = "https://github.com/moonlight-pm/oath"
tree = "apps/cell"
build = ["go", "zstd"]
run = ["crun", "passt", "certs", "zstd"]
