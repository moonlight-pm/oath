# The C library (R17): glibc and the Linux UAPI headers. Its loader is
# /lib/ld-linux-x86-64.so.2 and it searches /lib, the link farm of every
# linked package's libraries; there is no /lib64. `cargo make bootstrap`
# makes the first one (stage 0 of pkgs/bootstrap.sh); build.sh rebuilds
# it with pkg:gcc.
version = "2.44"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later AND GPL-2.0-only WITH Linux-syscall-note"
description = "The GNU C library with the Linux UAPI headers. Every program loads it from /lib."
home = "https://www.gnu.org/software/libc/"
purl = "pkg:generic/glibc@2.44"
build = ["python", "bison"]

[[source]]
url = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"
sig = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz.sig"
key = "glibc"

# Same pinned tarball as pkgs/linux; only the UAPI headers are used.
[[source]]
url = "https://git.kernel.org/torvalds/t/linux-7.3.tar.gz"
sha256 = "fd00c1da5cb8d190679248673ca6424492336818e3874a4752144ded942ff68b"
unsigned = "a cgit snapshot of Linus's signed tag v7.3: the same tree as kernel.org's linux-7.3.tar.xz, whose signature is Greg Kroah-Hartman's (no key for it is pinned here)"
