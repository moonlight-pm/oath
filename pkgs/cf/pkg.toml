# cf, Cloudflare's CLI for its whole API (open beta), from npm, with the
# packages npm resolves it to for glibc x86-64 (miniflare and workerd, for
# `cf dev`; sharp and its libvips, for images). It needs Node.js, not Bun
# (Cloudflare: commands that load cloudflare.config.ts fail on Bun), so it
# runs on pkg:node, its tree in its own pack: no global node_modules.
# Each tarball is pinned by sha256. npm signs each one's sha512 integrity
# with its registry key (ECDSA P-256); every one here was checked against
# that and npm's published keys when it was pinned (2026-10-30), but a
# fetch checks only the sha256. A new cf is a new set of pins.
version = "1.0.0-beta.26"
license = "(MIT OR Apache-2.0) AND MIT AND Apache-2.0 AND ISC AND CC0-1.0 AND LGPL-3.0-or-later AND BSD-2-Clause AND BSD-3-Clause AND MPL-1.1 AND Zlib AND IJG AND libpng-2.0 AND libtiff AND FTL"
description = "cf: Cloudflare's CLI for the whole Cloudflare API, with Workers' local runtime."
home = "https://github.com/cloudflare/cf"
purl = "pkg:npm/cf@1.0.0-beta.26"
build = ["node", "patchelf"]
run = ["node"]
unsigned = "npm signs the tarballs' integrity with its registry key, which oath-make does not check yet; each was checked by hand when pinned"

