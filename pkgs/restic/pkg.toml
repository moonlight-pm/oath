# restic, the backup program. The release's tarball is signed, and its go.sum
# names every module below, so its signature covers them too (R49). Built
# without cgo, as its own releases are. The roots are pkg:certs'. patches/ drops
# the Azure, Backblaze, Google Cloud and Swift backends, 48 of its 85 modules
# (R57); a repository on one of those needs rclone. Re-pin with:
#   pkgs/go-modules.sh restic ./cmd/restic
version = "0.19.1"
license = "BSD-2-Clause AND MIT AND BSD-3-Clause AND Apache-2.0 AND MPL-2.0"
description = "restic: fast, encrypted, deduplicating backups."
home = "https://restic.net/"
purl = "pkg:golang/github.com/restic/restic@0.19.1"
build = ["go"]
run = ["certs"]
unsigned = "Go modules from proxy.golang.org: go.sum in the signed release names each one, and the go command checks it in the build"

