license = "GPL-3.0-or-later"
description = "GNU readline: line editing and history, shared (bluetoothctl)."
home = "https://tiswww.case.edu/php/chet/readline/rltop.html"
purl = "pkg:generic/readline@8.3"
build = ["pkgconf", "ncurses"]
run = ["ncurses"]

