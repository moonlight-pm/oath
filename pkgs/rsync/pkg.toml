# rsync, with SHA checksums through OpenSSL and zstd compression; no ACLs, lz4
# or xxhash. Checked against Zen Dodd's key (R67), the one rsync's download page
# names for releases from 3.5.1 on. 3.5.1 was also co-signed by Andrew Tridgell,
# the key this file named until 3.5.2, which Zen Dodd alone signs.
version = "3.5.2"
license = "GPL-3.0-or-later"
description = "rsync: fast incremental file transfer."
home = "https://rsync.samba.org/"
category = "network"
purl = "pkg:generic/rsync@3.5.2"
build = ["openssl", "zlib", "zstd"]
run = ["openssl", "zlib", "zstd"]

[[source]]
url = "https://download.samba.org/pub/rsync/src/rsync-3.5.2.tar.gz"
sha256 = "a10d591825251e070f74c98df3daad195def4ed81b4a2de16169026aea33f6c8"
sig = "https://download.samba.org/pub/rsync/src/rsync-3.5.2.tar.gz.asc"
key = "rsync"
