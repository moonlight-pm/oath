# rsync, with SHA checksums through OpenSSL and zstd compression; no ACLs, lz4
# or xxhash. Checked against Andrew Tridgell's key (R51). 3.5.1 carries two
# signatures: Zen Dodd's, a maintainer since 2026, and his, added after rsync
# issue 1097 asked for provenance. A release only Zen Dodd signs stops the fetch
# until someone has looked.
version = "3.5.1"
license = "GPL-3.0-or-later"
description = "rsync: fast incremental file transfer."
home = "https://rsync.samba.org/"
category = "network"
purl = "pkg:generic/rsync@3.5.1"
build = ["openssl", "zlib", "zstd"]
run = ["openssl", "zlib", "zstd"]

[[source]]
url = "https://download.samba.org/pub/rsync/src/rsync-3.5.1.tar.gz"
sha256 = "c55f9c9dc10fb8bec397b399a0fdded53cc9a2d8e30891bb0d63724d25c37bef"
sig = "https://download.samba.org/pub/rsync/src/rsync-3.5.1.tar.gz.asc"
key = "rsync"
