# netavark: Podman's network backend, which it refuses to start without, even
# when containers use pasta or the host's network. Its crates come from the
# release's vendor tarball. A bridge network needs nft, which Oath does not
# ship yet, and aardvark-dns for names in it: not here, as Wicket's rootless
# containers use pasta. Neither tarball is signed.
version = "2.1.0"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND Unlicense AND Zlib"
description = "netavark: the network backend for Podman."
home = "https://github.com/containers/netavark"
purl = "pkg:github/containers/netavark@v2.1.0"
build = ["rust", "protobuf", "pkgconf"]
run = ["gcc"]
unsigned = "netavark publishes its release and vendor tarball with an unsigned sha256 list"

[[source]]
url = "https://github.com/containers/netavark/archive/refs/tags/v2.1.0.tar.gz"
sha256 = "96677048168ddd1abe313e4c2e17f1cace72b60ee1bac8ca12a4bd7dfcadfbbb"
file = "netavark-2.1.0.tar.gz"

