# PostgreSQL, the newest stable major (18), with OpenSSL, ICU collations, the
# xml type, zstd, UUIDs and contrib's extensions; no language servers, LDAP,
# GSSAPI or LLVM. A major version changes the data directory's format:
# upgrading across one is pg_upgrade, not a new pin alone. An extension in
# another pack (pkg:postgis) is found through extension_control_path. The
# project publishes hashes, no signature.
version = "18.6"
license = "PostgreSQL"
description = "PostgreSQL: the relational database server, its clients and contrib's extensions."
home = "https://www.postgresql.org/"
category = "server"
purl = "pkg:generic/postgresql@18.6"
build = ["bison", "flex", "icu", "libxml2", "openssl", "perl", "pkgconf", "readline", "ncurses", "util-linux", "zlib", "zstd"]
run = ["gcc", "icu", "libxml2", "openssl", "readline", "ncurses", "util-linux", "zlib", "zstd"]

[[source]]
url = "https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2"
sha256 = "555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f"
unsigned = "PostgreSQL publishes its tarballs with a sha256, not a signature"
