# The toolchain: clang, lld and the LLVM binutils, static musl binaries,
# with a sysroot of musl, Linux UAPI headers, compiler-rt, libunwind,
# libc++abi and libc++. `cargo make bootstrap` makes the first one
# (stage 1 of pkgs/bootstrap.sh); build.sh rebuilds it with itself.
version = "23.1.3"
license = "Apache-2.0 WITH LLVM-exception AND MIT AND GPL-2.0-only WITH Linux-syscall-note"
description = "Clang, lld and LLVM tools with a musl sysroot. cc / c++ build static by default."
home = "https://llvm.org/"
purl = "pkg:github/llvm/llvm-project@llvmorg-23.1.3"
build = ["llvm", "busybox", "make", "cmake", "ninja", "python"]

