# NVIDIA's driver for Linux (R34): its closed kernel modules, built by the
# build host against pkg:linux-build, and its userspace (GLX, EGL, GLES and
# Vulkan through libglvnd, GBM, CUDA, NVENC, nvidia-smi) and GSP firmware.
# A pack in the desk profile, so a stick shows the desk on an NVIDIA card
# (R89): NVIDIA's licence (1.1.d) lets a distribution for Linux pass it on
# with its binaries unchanged and the licence beside them, which build.sh
# keeps. Before R89 it was a recipe each machine built. No machine's
# settings live here: GSP off and power caps are one machine's overlay.
version = "595.104.02"
license = "LicenseRef-NVIDIA-Driver"
description = "NVIDIA's driver: closed kernel modules for pkg:linux, its GL, EGL, Vulkan, GBM and CUDA libraries (and their 32-bit ones), nvidia-smi and GSP firmware."
home = "https://www.nvidia.com/en-us/drivers/unix/"
category = "graphics"
purl = "pkg:generic/nvidia@595.104.02"
build = [
	"bash", "coreutils", "sed", "grep", "gawk", "findutils", "diffutils", "tar", "zstd", "make",
	"gcc", "glibc", "elfutils", "linux-build",
]
run = [
	"gcc", "libdrm", "libx11", "libxcb", "libxext", "mesa", "wayland", "libglvnd", "libglvnd-i386",
	"libx11-i386", "libxext-i386",
]

[[source]]
url = "https://download.nvidia.com/XFree86/Linux-x86_64/595.104.02/NVIDIA-Linux-x86_64-595.104.02.run"
sha256 = "e421c202e4c79f58c3c7f3161bbe71454ebb3d88936f88205a0e327cd04c59ca"
unsigned = "NVIDIA publishes a sha256sum beside the .run over HTTPS, not a signature"
