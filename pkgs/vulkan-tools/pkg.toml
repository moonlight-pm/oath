# vulkaninfo only: not vkcube or the mock driver. It loads
# libvulkan.so.1 with dlopen, so it needs the loader without linking it.
version = "1.4.367"
license = "Apache-2.0"
description = "vulkaninfo: the Vulkan devices, drivers, layers and surfaces this machine has."
home = "https://github.com/KhronosGroup/Vulkan-Tools"
category = "graphics"
purl = "pkg:github/KhronosGroup/Vulkan-Tools@v1.4.367"
build = ["cmake", "pkgconf", "vulkan-headers", "xorgproto", "libx11", "libxcb", "wayland"]
run = ["vulkan-loader", "libx11", "libxcb", "wayland", "gcc"]

