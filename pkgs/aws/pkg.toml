# AWS CLI v2 from AWS's signed source tarball, on pkg:python: no second
# interpreter, and Python's ssl is pkg:openssl's. Its code and the Python
# libraries it needs stay in libexec/aws-cli, so nothing reaches /lib or
# Python's own site-packages. Each sdist is pinned by sha256; build.sh copies
# them into place with no pip and no setup.py, and components.json names each.
#
# urllib3 is 2.8.0, past AWS's `<=2.6.3`: 2.6.3 has CVE-2026-44431, 44432,
# 97687, 97688 and 97689. AWS's unit tests pass against it (2026-11-09).
# ruamel.yaml's C extension is left out; it falls back to its pure Python
# parser and emitter. Python's source is here only for its _sqlite3 module,
# which pkg:python does not build: it must be pkg:python's version.
# awscrt keeps its own AWS-LC, because s2n does not build on OpenSSL 4.
# A new aws-cli is a new set of pins: requirements/download-deps in its tarball
# names them.
#
# session-manager-plugin is here too: AWS's Go program that `aws ssm
# start-session` runs for a shell or a forwarded port. From AWS's source tag; only
# its .deb and .rpm are signed. Its vendor/ tree is the whole AWS SDK, 417
# services, with no record of which versions, so it is not unpacked:
# go-updates.txt names what it holds and two versions OSV lists, and each module is pinned
# from Go's proxy. Nothing else speaks its protocol, and writing it would be a
# second implementation of KMS-encrypted sessions. Re-pin with:
#   pkgs/go-modules.sh aws ./src/sessionmanagerplugin-main
version = "2.39.4"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND ISC AND OpenSSL AND PSF-2.0 AND blessing"
description = "AWS CLI v2 and its Session Manager plugin: Amazon Web Services from the terminal."
home = "https://aws.amazon.com/cli/"
category = "toolchain"
purl = "pkg:github/aws/aws-cli@2.39.4"
build = ["python", "cmake", "sqlite", "go"]
run = ["python", "certs", "less"]
unsigned = "PyPI publishes no signature for these sdists; AWS signs the plugin's .deb and .rpm but not its source tag; go.sum names each Go module, checked against Go's checksum database when pinned"

