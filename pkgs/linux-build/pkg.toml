# The kernel's build tree for modules built outside it (R34: NVIDIA's).
# Same source and patches as pkg:linux (patches/ is pkgs/linux's), with
# pkg:linux's own config and Module.symvers. Bump with pkgs/linux.
version = "7.3"
license = "GPL-2.0-only WITH Linux-syscall-note"
description = "pkg:linux's build tree under build/: its config, exported symbols, prepared headers, scripts and objtool, for modules built outside the kernel."
home = "https://www.kernel.org/"
purl = "pkg:generic/linux@7.3"
build = ["linux", "m4", "flex", "bison", "perl", "pkgconf", "zlib", "elfutils", "bc"]
run = ["elfutils"]

[[source]]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.tar.xz"
sha256 = "87363c24f10e06321eb362765521094e94471f6bff8bce2d6b3e40f39f004953"
# kernel.org signs the uncompressed tar.
sig = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.tar.sign"
key = "linux"
decompress = "xz"
