# Prism Launcher: a Minecraft Java Edition launcher that keeps instances
# (a version, a mod loader, mods, worlds) and installs mods and modpacks from
# Modrinth and CurseForge. Built from its signed release tag against Qt 6 on
# Wayland. Microsoft sign-in is a code typed on any device, shown with a QR
# Code. Its own Java downloader and updater are off: Java is pkg:jre-21 (and
# any other pkg:jre-* on the machine). The game's libraries, which Minecraft
# downloads, load OpenGL, Vulkan, X11 (the game runs on Xwayland until 26.3),
# Wayland, PipeWire, PulseAudio and ALSA from /lib, so those packs run with it.
# bin/prismlauncher runs it in a bubblewrap box (R74): Prism's folder, the
# display, sound, the GPU and pads, the network; not the rest of /home, /run
# or /dev/uinput, and no sudo. Feral's GameMode is not on Oath: a stub header
# says so, and Prism greys out its setting.
version = "11.1.1"
license = "GPL-3.0-only AND Apache-2.0 AND LGPL-3.0-or-later AND MIT"
description = "Prism Launcher: Minecraft instances, mods and modpacks, in a box."
home = "https://prismlauncher.org/"
category = "games"
purl = "pkg:github/PrismLauncher/PrismLauncher@11.1.1"
build = [
	"cmake", "ninja", "pkgconf", "qtbase", "qtsvg", "qtnetworkauth", "extra-cmake-modules",
	"cmark", "libarchive", "tomlplusplus", "libqrencode", "zlib", "bzip2", "xz", "zstd",
	"libglvnd", "libxkbcommon", "wayland", "jdk-21",
]
run = [
	"gcc", "qtbase", "qtsvg", "qtimageformats", "qtnetworkauth", "cmark", "libarchive",
	"libqrencode", "zlib", "bubblewrap", "jre-21", "libglvnd", "vulkan-loader", "libx11",
	"libxcursor", "libxext", "libxi", "libxrandr", "libxrender", "libxxf86vm", "libxkbcommon",
	"wayland", "libpulse", "pipewire", "alsa-lib",
]

