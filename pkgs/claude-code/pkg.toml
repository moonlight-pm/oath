# Claude Code, Anthropic's coding agent: the vendor's Linux build (R7), a
# Bun single-file executable, from the stable channel. A recipe (R23):
# Anthropic's terms allow no redistribution, so no image or origin holds
# the pack; each machine fetches the binary from downloads.claude.ai and
# builds it with `oath build plan:claude-code`. The pin is the sha256 that
# the release's manifest.json lists, and Anthropic signs the manifest. The
# binary loads only glibc; of its two embedded add-ons, one also loads
# libasound (voice).
version = "2.1.311"
license = "LicenseRef-Anthropic-Commercial-Terms"
description = "Claude Code: Anthropic's agentic coding tool for the terminal."
home = "https://code.claude.com/docs"
category = "agents"
purl = "pkg:generic/claude-code@2.1.311"
recipe = "Anthropic's terms allow no redistribution; each machine fetches the binary itself"
build = ["bash", "coreutils", "grep", "glibc"]
run = []

[[source]]
url = "https://downloads.claude.ai/claude-code-releases/2.1.311/linux-x64/claude"
sha256 = "86dc1fcc69498159eaf15f446613e847010f9036bfbbdffd4c49350be8489ada"
sig = "https://downloads.claude.ai/claude-code-releases/2.1.311/manifest.json.sig"
sums = "https://downloads.claude.ai/claude-code-releases/2.1.311/manifest.json"
key = "anthropic"
