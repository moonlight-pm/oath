# libxml2: PostgreSQL's xml type and PostGIS's GML and KML. CEF carries its own
# copy. GNOME's tarball adds autotools' output, so this is the signed tag's tree,
# from GNOME's GitHub mirror, whose archive must match the tag from GNOME's own
# GitLab (R54), and it builds with meson.
version = "2.15.4"
license = "MIT"
description = "libxml2: an XML parser and toolkit."
home = "https://gitlab.gnome.org/GNOME/libxml2"
purl = "pkg:generic/libxml2@2.15.4"
build = ["meson", "ninja", "python", "pkgconf", "zlib"]
run = ["zlib"]

