# libxml2: PostgreSQL's xml type and PostGIS's GML and KML. CEF carries its own
# copy. GNOME publishes a sha256, no signature, since 2.13.
version = "2.15.4"
license = "MIT"
description = "libxml2: an XML parser and toolkit."
home = "https://gitlab.gnome.org/GNOME/libxml2"
purl = "pkg:generic/libxml2@2.15.4"
build = ["pkgconf", "zlib"]
run = ["zlib"]

[[source]]
url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"
unsigned = "GNOME publishes libxml2 with a sha256 list, not a signature"
