# crun: the OCI runtime Podman starts containers with. No systemd, no CRIU
# and no WebAssembly. Signed by Giuseppe Scrivano, its maintainer.
version = "1.30.1"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
description = "crun: a fast, low-memory OCI container runtime in C."
home = "https://github.com/containers/crun"
category = "machines"
purl = "pkg:github/containers/crun@1.30.1"
build = ["pkgconf", "python", "libcap", "libseccomp", "json-c"]
run = ["libcap", "libseccomp", "json-c"]

[[source]]
url = "https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1.tar.gz"
sha256 = "99d036d95113552b6df66c7c879432835504bf0e525fc0372745071df129527b"
sig = "https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1.tar.gz.asc"
