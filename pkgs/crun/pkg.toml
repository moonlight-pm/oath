# crun: the OCI runtime Podman starts containers with. No systemd, no CRIU
# and no WebAssembly. Signed by one of the keys in its crun.keyring.
version = "1.31"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
description = "crun: a fast, low-memory OCI container runtime in C."
home = "https://github.com/containers/crun"
category = "machines"
purl = "pkg:github/containers/crun@1.31"
build = ["pkgconf", "python", "libcap", "libseccomp", "json-c"]
run = ["libcap", "libseccomp", "json-c"]

[[source]]
url = "https://github.com/containers/crun/releases/download/1.31/crun-1.31.tar.gz"
sha256 = "17d04ba159fada1f1300a36b8afe869afb38bf1bbda28da052e83bb4bee20108"
sig = "https://github.com/containers/crun/releases/download/1.31/crun-1.31.tar.gz.asc"
key = "crun"
