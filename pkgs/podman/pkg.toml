# Podman, daemonless containers. With conmon, crun and passt in `run`, which it
# finds in /bin, and a stand-in for netavark, since a rootless container's network
# is pasta (R53, R57); no systemd, no btrfs driver, no gpgme (openpgp in Go), and
# SQLite from pkg:sqlite, not the copy go-sqlite3 carries. Its modules are
# below in place of its vendor/, since a module's fix may not wait for a
# release (R49). Paths under /etc that it reads by default are in its pack.
# Rootless, a container holds one uid, the account that runs it (R53): patches/
# stops Podman calling that an error, and storage.conf loads any image. Re-pin with:
#   pkgs/go-modules.sh --cgo \
#     --tags 'grpcnotrace seccomp libsqlite3 containers_image_openpgp exclude_graphdriver_btrfs' \
#     podman ./cmd/podman ./cmd/rootlessport ./cmd/quadlet
version = "6.1.4"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND MPL-2.0 AND ISC"
description = "Podman: run OCI containers, without a daemon."
home = "https://podman.io/"
purl = "pkg:golang/github.com/containers/podman/v6@6.1.4"
build = ["go", "pkgconf", "libseccomp", "sqlite"]
run = ["certs", "libseccomp", "conmon", "crun", "passt"]
unsigned = "Go modules from proxy.golang.org: the go command checks each against go.sum in the build, and Go's checksum database checked them when pinned"

