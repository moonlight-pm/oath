sha256 = "200fd9b4b6d820cae24fc99d8e290ec945512365cf3cda8283b3905c0c284ea8"
file = "podman-6.1.4.tar.gz"
git = "https://github.com/containers/podman"
tag = "v6.1.4"
key = "heon"

