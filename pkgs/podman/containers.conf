# Oath's defaults. A machine's own settings go in /etc/containers.
[engine]
# conmon and the rest are other packs, whose programs are in /bin.
helper_binaries_dir = ["/bin"]
# Oath has no /var/tmp, the default ("storage" needs a directory nothing
# makes). /tmp is memory: a machine pulling large images names a disk here.
image_copy_tmp_dir = "/tmp"
