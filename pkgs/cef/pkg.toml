# CEF, the Chromium Embedded Framework that Sola's browser is built
# against, built from Chromium's and CEF's source with Chrome's codecs
# (H.264 and AAC in MP4; Joshua, 2026-10-28), which the vendor's binary
# leaves out. The same commit as the vendor's 156.0.28, so a program
# built against its headers loads this libcef.so. The vendor builds it on
# Chromium 156.0.8078.88, for which Google published no tarball; .93 is the
# same branch 46 commits on, with the same DEPS toolchain. Chromium builds only
# with its own Clang and Rust (R40): the toolchain packages its DEPS
# pins, build inputs here and never on a machine.
version = "156.0.28+g57389f0+chromium-156.0.8078.93"
license = "BSD-3-Clause AND LicenseRef-Chromium-Credits"
description = "CEF, the Chromium Embedded Framework, with H.264 and AAC, for sola-browser."
home = "https://github.com/chromiumembedded/cef"
category = "browser"
purl = "pkg:generic/cef@156.0.28+g57389f0+chromium-156.0.8078.93"
build = [
	"python", "ninja", "pkgconf", "patchelf", "libdrm", "libpulse", "harfbuzz", "fribidi",
	"freetype", "fontconfig", "pixman", "xorgproto", "gperf",
	"glib", "nspr", "nss", "at-spi2-core", "dbus", "cups", "libx11", "libxcomposite",
	"libxdamage", "libxext", "libxfixes", "libxrandr", "mesa", "libglvnd", "expat", "libxcb",
	"libxkbcommon", "cairo", "pango", "libudev-zero", "alsa-lib", "vulkan-loader",
]
# What libcef.so links (DT_NEEDED) and what it opens: libglvnd's EGL and GL
# (and their headers, which Mesa no longer ships), with Mesa as their vendor,
# the Vulkan loader, libpulse for sound.
run = [
	"glib", "nspr", "nss", "at-spi2-core", "dbus", "cups", "libx11", "libxcb",
	"libxkbcommon", "mesa", "libglvnd", "expat", "libffi", "libudev-zero", "alsa-lib", "gcc",
	"vulkan-loader", "libpulse",
]

# Google's release tarball, with every DEPS source a build reads.
