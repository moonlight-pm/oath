# Python's tree carries expat (pyexpat) and HACL* (hashlib, MIT or
# Apache-2.0); _decimal needs a system libmpdec, which Oath does not
# package, so it is not built.
version = "3.15.2"
license = "PSF-2.0 AND MIT"
description = "CPython. A build tool (glibc's and meson's builds need it); not in the base image."
home = "https://www.python.org/"
purl = "pkg:generic/cpython@3.15.2"
build = ["pkgconf", "zlib", "zstd", "openssl", "libffi"]
run = ["bzip2", "xz", "zlib", "zstd", "openssl", "libffi"]

