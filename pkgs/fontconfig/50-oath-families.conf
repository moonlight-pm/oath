<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Oath: the generic families name the font packages Oath ships. Noto
     for text (Simplified Chinese for untagged Han), Iosevka Term Slab for
     monospace with Noto Sans Mono after it, Noto Sans Math for math. -->
<fontconfig>
	<alias>
		<family>sans-serif</family>
		<prefer><family>Noto Sans</family><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer><family>Noto Serif</family><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias>
		<family>system-ui</family>
		<prefer><family>Noto Sans</family></prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer><family>Iosevka Term Slab</family><family>Noto Sans Mono</family><family>Noto Sans Mono CJK SC</family></prefer>
	</alias>
	<alias>
		<family>math</family>
		<prefer><family>Noto Sans Math</family></prefer>
	</alias>
	<alias>
		<family>emoji</family>
		<prefer><family>Noto Color Emoji</family></prefer>
	</alias>
</fontconfig>
