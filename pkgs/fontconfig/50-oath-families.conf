<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Oath: the generic families name the font packages Oath ships. -->
<fontconfig>
	<alias binding="same">
		<family>sans-serif</family>
		<prefer><family>Inter</family></prefer>
	</alias>
	<alias binding="same">
		<family>serif</family>
		<prefer><family>Inter</family></prefer>
	</alias>
	<alias binding="same">
		<family>system-ui</family>
		<prefer><family>Inter</family></prefer>
	</alias>
	<alias binding="same">
		<family>monospace</family>
		<prefer><family>Iosevka Term Slab</family></prefer>
	</alias>
</fontconfig>
