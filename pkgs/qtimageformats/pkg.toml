# Qt Image Formats, WebP alone: the plugin that reads the WebP icons
# Modrinth serves (Prism Launcher). Its own copy of libwebp is built in; the
# plugins for TIFF, MNG, JPEG 2000, TGA, WBMP, ICNS and DDS are not shipped.
# Built against pkg:qtbase into its own pack; a program names its plugins/
# in QT_PLUGIN_PATH. Qt publishes md5 sums, not signatures; the tarball is
# set against its git tag.
version = "6.11.3"
license = "(LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only) AND BSD-3-Clause"
description = "Qt 6's WebP image plugin."
home = "https://www.qt.io/"
category = "desk"
purl = "pkg:generic/qtimageformats@6.11.3"
build = ["cmake", "ninja", "pkgconf", "qtbase", "zlib", "libglvnd", "libxkbcommon", "wayland"]
run = ["qtbase", "gcc"]

[[source]]
url = "https://download.qt.io/official_releases/qt/6.11/6.11.3/submodules/qtimageformats-everywhere-src-6.11.3.tar.xz"
sha256 = "2759929c7abbc5376120394d1ccac1abbb816bc2791b34ece6c1412d323e6213"
unsigned = "Qt publishes md5 sums (md5sums.txt) over HTTPS, not a signature"
