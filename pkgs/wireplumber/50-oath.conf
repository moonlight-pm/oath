# Oath: Bluetooth through BlueZ on the system bus (svc:bluetooth); no
# logind, no portals; device reservation needs a D-Bus peer that does not
# run here. BlueZ's MIDI and the logind seat check are off with them.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    monitor.bluez-midi = disabled
    hardware.video-capture = disabled
    support.reserve-device = disabled
    monitor.alsa.reserve-device = disabled
    support.portal-permissionstore = disabled
    script.client.access-portal = disabled
  }
}
