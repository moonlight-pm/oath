# Qt's base module, for Prism Launcher: Core, Gui, Widgets, Network, OpenGL,
# Xml, Concurrent and Test, on Wayland alone (Qt 6.11 carries the Wayland
# client; no X11), with EGL and desktop GL through libglvnd, OpenSSL linked,
# fontconfig, FreeType, HarfBuzz, zlib and zstd from their packs. No D-Bus,
# GLib, ICU, SQL, printing or Vulkan. Its own copies of PCRE2 (Qt needs the
# 16-bit library, which pkg:pcre2 does not build), libpng, libjpeg,
# double-conversion, md4c, libb2, libpsl and forkfd are built in and move
# with its releases. The TLS backend reads pkg:certs' list. Qt publishes md5
# sums, not signatures; the tarball is set against its git tag.
version = "6.11.3"
license = "(LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only) AND BSD-3-Clause AND MIT AND Zlib AND Libpng AND IJG AND CC0-1.0 AND BSL-1.0"
description = "Qt 6's base: Core, Gui, Widgets, Network and OpenGL, on Wayland."
home = "https://www.qt.io/"
category = "desk"
purl = "pkg:generic/qtbase@6.11.3"
build = [
	"cmake", "ninja", "pkgconf", "zlib", "zstd", "openssl", "harfbuzz", "freetype", "fontconfig",
	"libxkbcommon", "wayland", "libglvnd", "glib",
]
run = [
	"gcc", "zlib", "zstd", "openssl", "harfbuzz", "freetype", "fontconfig",
	"libxkbcommon", "wayland", "libglvnd", "certs",
]

[[source]]
url = "https://download.qt.io/official_releases/qt/6.11/6.11.3/submodules/qtbase-everywhere-src-6.11.3.tar.xz"
sha256 = "46de0710b594945a5d446ae44354daa386141c6903c53781b2ca547bc62f8f8f"
unsigned = "Qt publishes md5 sums (md5sums.txt) over HTTPS, not a signature"
