# Blocky, the DNS proxy with ad blocking. No signature to check: a tag's
# archive, whose go.sum names every module below (R49). Built without cgo, as
# its own releases are. It embeds a CA list of its own (breml/rootcerts) as
# Go's fallback, which Go reads only when it finds no roots, and pkg:certs,
# in `run`, is what it finds. Blocky is Apache-2.0, but it links ThinkChaos's
# parcour, a query-list parser, which is AGPL-3.0: the program as shipped
# carries that licence's terms. Re-pin with: pkgs/go-modules.sh blocky .
version = "0.35.0"
license = "Apache-2.0 AND AGPL-3.0-only AND MIT AND BSD-3-Clause AND BSD-2-Clause AND MPL-2.0 AND ISC AND CC0-1.0"
description = "Blocky: a DNS proxy and ad blocker for the local network."
home = "https://0xerr0r.github.io/blocky/"
category = "server"
purl = "pkg:golang/github.com/0xERR0R/blocky@0.35.0"
build = ["go"]
run = ["certs"]
unsigned = "Blocky signs neither tags nor releases; its modules come from proxy.golang.org, and the go command checks each against go.sum in the build"

