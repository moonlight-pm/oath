# Qt SVG: Qt's SVG renderer and widgets, and the SVG image and icon plugins
# (Prism Launcher's icons). Built against pkg:qtbase into its own pack; a
# program names its plugins/ in QT_PLUGIN_PATH. Qt publishes md5 sums, not
# signatures; the tarball is set against its git tag.
version = "6.11.3"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
description = "Qt 6's SVG module and its image and icon plugins."
home = "https://www.qt.io/"
category = "desk"
purl = "pkg:generic/qtsvg@6.11.3"
build = ["cmake", "ninja", "pkgconf", "qtbase", "zlib", "libglvnd", "libxkbcommon", "wayland"]
run = ["qtbase", "gcc", "zlib"]

[[source]]
url = "https://download.qt.io/official_releases/qt/6.11/6.11.3/submodules/qtsvg-everywhere-src-6.11.3.tar.xz"
sha256 = "9bdf6fa4b5a2d91c3eaa2edd12263fdff0ae19d0ac25d3c99946cd4189a07123"
unsigned = "Qt publishes md5 sums (md5sums.txt) over HTTPS, not a signature"
