# pkgs/libglvnd for i386 (R29).
i386 = "libglvnd"
description = "libglvnd for i386 programs (lib32/): libEGL, libGL, libGLX, libOpenGL and libGLESv2 (Steam's 32-bit games)."
build = ["meson", "ninja", "python", "pkgconf", "xorgproto", "libx11-i386", "libxext-i386"]
run = ["libx11-i386", "libxext-i386"]
