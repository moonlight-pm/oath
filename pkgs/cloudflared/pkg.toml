# cloudflared, the client of Cloudflare Tunnel, built from its tag's tree with
# the modules below (R49), so Go's fixes and pkg:certs' roots reach it. Nothing
# else speaks the tunnel's protocol, so our own code is no candidate; Cloudflare's
# own binary would be one file to pin, but no fix of ours could reach it. It links
# two forks by replace: github.com/chungthuang/quic-go is quic-go v0.59.1 and two
# Cloudflare commits (read 2026-11-03: a TUNNEL_MAX_QUIC_PACKET_SIZE variable, and
# AEAD code only under the boringcrypto tag, which this build does not set), though
# its pseudo-version says v0.45.1; github.com/ipostelnik/cli/v2 is urfave/cli from
# early 2021 and three Cloudflare commits to how flags resolve (read 2026-11-03).
# OSV matches them by their own names, so it reports nothing for either: quic-go's
# advisories are read by hand. Its 67 modules came in as a first pin's baseline, by
# Joshua's word, recorded and not reviewed. Re-pin with:
#   pkgs/go-modules.sh cloudflared ./cmd/cloudflared
version = "2026.10.5"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause"
description = "cloudflared: Cloudflare Tunnel's client, which connects a machine's services to Cloudflare without an open port."
home = "https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/"
category = "network"
purl = "pkg:golang/github.com/cloudflare/cloudflared@2026.10.5"
build = ["go"]
run = ["certs"]
unsigned = "Cloudflare's tags are annotated and unsigned; its modules come from proxy.golang.org, and the go command checks each against go.sum in the build"

