# llama.cpp's server: an OpenAI-compatible HTTP server for local models, and the engine
# Ollama itself runs. R57's cheaper route: Ollama would add 55 Go modules, 28 of them new
# names, and endpoints that pull, create and push models, around this same program. No
# dependency of its own (its vendored C++ is in the tag); the options and one patch in
# build.sh leave out what it does not need. Needs AVX2: there is no plugin to load a
# lesser CPU's build from, and a model on such a machine is too slow to use. Vulkan, not
# CUDA: CUDA takes NVIDIA's compiler, and Vulkan takes the driver a machine already has.
# This tag is release v0.8.0's commit; the b numbers are what CVE records name.
version = "b11960"
license = "MIT AND BSD-2-Clause AND (MIT OR Unlicense) AND (Unlicense OR MIT-0)"
description = "llama.cpp: llama-server, local models over Chat Completions, on the CPU or a GPU through Vulkan. Needs AVX2. `writ serve` runs it in a box (R65)."
home = "https://github.com/ggml-org/llama.cpp"
category = "agents"
purl = "pkg:github/ggml-org/llama.cpp@b11960"
build = ["cmake", "glslang", "spirv-headers", "vulkan-headers", "vulkan-loader"]
run = ["gcc", "vulkan-loader"]

