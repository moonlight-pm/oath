# Oath's two patches (patches/, from forks/wlroots): wlr-screencopy
# leaves out the software cursor when asked to, and libinput falls back
# to /dev/input/event* when its udev backend finds nothing.
version = "0.20.2"
license = "MIT"
description = "wlroots, shared: the compositor library under rivulet (DRM, libinput, GLES2, Xwayland)."
home = "https://gitlab.freedesktop.org/wlroots/wlroots"
purl = "pkg:generic/wlroots@0.20.2"
build = [
	"meson", "ninja", "python", "pkgconf", "wayland", "wayland-protocols", "hwdata",
	"libdrm", "mesa", "libinput", "libxkbcommon", "pixman", "seatd", "libudev-zero",
	"libdisplay-info", "xorgproto", "libxcb", "xcb-util-wm", "xcb-util-errors", "xwayland",
	"libglvnd",
]
run = [
	"wayland", "libdrm", "mesa", "libinput", "libxkbcommon", "pixman", "seatd", "libudev-zero",
	"libdisplay-info", "libxcb", "xcb-util-wm", "xcb-util-errors", "xwayland", "libglvnd",
]

