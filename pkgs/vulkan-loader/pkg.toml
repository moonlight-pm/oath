url = "https://github.com/KhronosGroup/Vulkan-Loader/archive/refs/tags/v1.4.367.tar.gz"
sha256 = "f70da1e3c63b55bae070dd44dfb9ca77523dba3781b6cb8aad3a1ceef4e902b7"
file = "Vulkan-Loader-1.4.367.tar.gz"
