# BlueZ: bluetoothd, the Bluetooth daemon, on the system bus
# (svc:dbus-system, as root), with its profiles built in (A2DP and AVRCP
# for PipeWire, HID and HoG for controllers and keyboards); bluetoothctl
# and btmgmt to pair and manage; btmon; libbluetooth, which PipeWire's
# Bluetooth plugin builds with. No OBEX, mesh, MIDI, CUPS or udev rules.
version = "5.88"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
description = "BlueZ: bluetoothd, bluetoothctl, btmgmt, btmon and libbluetooth."
home = "https://www.bluez.org/"
category = "network"
purl = "pkg:generic/bluez@5.88"
build = ["pkgconf", "glib", "dbus", "readline", "ncurses"]
run = ["glib", "dbus", "readline", "ncurses"]

[[source]]
url = "https://www.kernel.org/pub/linux/bluetooth/bluez-5.88.tar.xz"
sha256 = "6952c39eb5f8b0ee712cc50ab3bcff03be17c410dd97ca640f4849d9a1653ba3"
# kernel.org signs the uncompressed tar.
sig = "https://www.kernel.org/pub/linux/bluetooth/bluez-5.88.tar.sign"
key = "holtmann"
decompress = "xz"
