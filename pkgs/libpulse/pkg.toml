# The PulseAudio client libraries only; pipewire-pulse is the server.
version = "17.0"
license = "LGPL-2.1-or-later"
description = "libpulse, libpulse-simple and libpulse-mainloop-glib, pactl and pacat (PulseAudio 17's client)."
home = "https://www.freedesktop.org/wiki/Software/PulseAudio/"
purl = "pkg:generic/pulseaudio@17.0"
build = ["meson", "ninja", "python", "pkgconf", "m4", "glib", "libsndfile"]
run = ["glib", "libsndfile"]

