# The compiler (R17): GCC (C, C++) and binutils, with GMP, MPFR and MPC
# built into it. Its runtime libraries (libgcc_s, libstdc++, libatomic,
# libgomp) are in lib/. It links every program with glibc's loader at
# /lib/ld-linux-x86-64.so.2 and reads glibc's headers from
# /oath/store/pkg/glibc/live/include. `cargo make bootstrap` makes the
# first one (stage 1 of pkgs/bootstrap.sh); build.sh rebuilds it with
# itself.
version = "16.2.0"
license = "GPL-3.0-or-later WITH GCC-exception-3.1 AND GPL-3.0-or-later AND LGPL-3.0-or-later"
description = "GCC 16 (C, C++) and binutils 2.47. cc / c++ link dynamically against glibc through /lib."
home = "https://gcc.gnu.org/"
purl = "pkg:generic/gcc@16.2.0"
build = []

