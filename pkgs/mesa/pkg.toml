# radeonsi and RADV compile with ACO (GFX6 and newer), so no LLVM; RADV
# builds its BVH shaders with glslang. softpipe is the software
# fallback, and Xwayland's GLX falls back to it (swrast_dri.so).
# Its vendor libraries are loaded by pkg:libglvnd, whose headers and
# egl.pc, gl.pc and glesv2.pc it builds with; gbm.pc is Mesa's.
version = "26.2.5"
license = "MIT AND Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0"
description = "Mesa: radeonsi, RADV (Vulkan) and softpipe, GBM, and EGL, GLES and GL through libglvnd, on Wayland and X11 (GLX)."
home = "https://mesa3d.org/"
purl = "pkg:generic/mesa@26.2.5"
build = [
	"meson", "ninja", "python", "pkgconf", "bison", "flex", "glslang",
	"python-mako", "python-pyyaml", "python-packaging",
	"libdrm", "wayland", "wayland-protocols", "expat", "zlib", "zstd", "elfutils",
	"xorgproto", "libx11", "libxcb", "libxext", "libxxf86vm", "libxshmfence", "libglvnd",
]
run = [
	"gcc", "libdrm", "wayland", "expat", "zlib", "zstd", "elfutils",
	"libx11", "libxcb", "libxext", "libxxf86vm", "libxshmfence", "libxfixes",
]

