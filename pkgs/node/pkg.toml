# Node.js, the JavaScript runtime, built from source (R7), the current LTS line
# (26, "Lithium"), checked against the SHASUMS256.txt its releaser signs
# (pkgs/keys/node.asc, a release key nodejs/node's README lists). It carries its
# own V8, OpenSSL and ICU, and loads libstdc++, libgcc_s and libatomic (pkg:gcc).
# The full notice, every bundled project's licence, is share/doc/node/LICENSE.
# It runs the programs Oath packs from npm, each with its own tree (pkg:cf), so
# no machine keeps a global node_modules.
version = "26.13.1"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND BSD-2-Clause AND ISC AND Artistic-2.0 AND Unicode-3.0 AND Zlib"
description = "Node.js: the JavaScript runtime, with npm and npx."
home = "https://nodejs.org/"
category = "toolchain"
purl = "pkg:generic/node@26.13.1"
build = ["python"]
run = ["gcc"]

