# The vendor's Rust release (R7), pinned by sha256: rustc and cargo built
# for a glibc host, and the standard library for the glibc and UEFI
# targets. Its binaries name /lib64/ld-linux-x86-64.so.2; Oath's loader is
# /lib/ld-linux-x86-64.so.2 (R17), so the plan points them there. They
# find their own libraries by the vendor's RUNPATH ($ORIGIN/../lib), and
# libz and libgcc_s through /lib (pkg:zlib, pkg:gcc). The release's full
# notice is share/doc/rust/COPYRIGHT.html. A build tool; not in the base
# image.
version = "1.99.1"
license = "(MIT OR Apache-2.0) AND Apache-2.0 WITH LLVM-exception AND MIT"
description = "Rust: rustc, cargo and the glibc and UEFI standard libraries."
home = "https://www.rust-lang.org/"
purl = "pkg:generic/rust@1.99.1"
build = ["patchelf", "zlib"]
run = ["gcc", "zlib"]

