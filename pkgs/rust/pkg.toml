# The vendor's Rust release (R7), pinned by sha256: rustc and cargo built
# for a musl host, and the standard library for the musl and UEFI
# targets. Those binaries load musl's dynamic linker and libgcc_s, so the
# pack builds its own from source: musl's shared libc (the loader) and
# LLVM's libunwind as libgcc_s.so.1. The release's full notice is
# share/doc/rust/COPYRIGHT.html. The .tar.gz tarballs, not .tar.xz:
# rustc's xz dictionary is 128 MiB and busybox's unxz stops at 64 MiB.
# A build tool; not in the base image.
version = "1.99.1"
license = "(MIT OR Apache-2.0) AND Apache-2.0 WITH LLVM-exception AND MIT"
description = "Rust: rustc, cargo and the musl and UEFI standard libraries, with their own loader."
home = "https://www.rust-lang.org/"
purl = "pkg:generic/rust@1.99.1"
build = ["llvm", "busybox", "make", "patchelf"]

