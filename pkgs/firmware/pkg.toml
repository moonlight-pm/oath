# Firmware blobs the base kernel loads: tg3 (tigon) for canto's Broadcom
# NIC and SI Pitcairn (amdgpu, radeon) for canto's GPUs. Vendor files from
# linux-firmware tag 20260916, pinned one by one. Add a blob here when a
# machine needs it.
version = "20260916"
license = "LicenseRef-linux-firmware"
description = "Firmware blobs from linux-firmware for the machines Oath runs on."
home = "https://gitlab.com/kernel-firmware/linux-firmware"
build = []
unsigned = "cgit serves single blobs; linux-firmware signs only its git tags"

