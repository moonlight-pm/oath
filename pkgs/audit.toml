names = ["wireplumber"]

[wl-clipboard]
names = ["wl-clipboard"]

[wlroots]
names = ["wlroots"]

[xcb-proto]
skip = "protocol XML, data"

[xcb-util-errors]
names = ["xcb-util-errors"]

[xcb-util-wm]
names = ["xcb-util-wm"]

[xkbcomp]
cpe = "cpe:2.3:a:x.org:xkbcomp"

[xkeyboard-config]
skip = "keyboard layouts, data"

[xorgproto]
skip = "protocol headers"

[xtrans]
skip = "headers and inline code built into the X libraries"

[xwayland]
cpe = "cpe:2.3:a:x.org:xwayland"

[xwayland.not_affected]
"CVE-2024-21886" = "fixed in Xwayland 23.2.4 (X.Org's advisory of 2024-01-16); Oath builds 24.1.14"

[xz]
cpe = "cpe:2.3:a:tukaani:xz"
repo = "https://github.com/tukaani-project/xz"
tag = "v{version}"

[zlib]
cpe = "cpe:2.3:a:zlib:zlib"
repo = "https://github.com/madler/zlib"
tag = "v{version}"

[zlib.not_affected]
"CVE-2026-76844" = "fixed by df84af25, the commit patches/CVE-2026-85091-gzwrite.patch applies (the record names it)"

[zsh]
cpe = "cpe:2.3:a:zsh:zsh"

[zstd]
cpe = "cpe:2.3:a:facebook:zstandard"
names = ["zstd"]
repo = "https://github.com/facebook/zstd"
tag = "v{version}"
