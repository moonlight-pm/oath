# What the daily security audit (R48, `cargo make audit`) matches each
# package by. No plan or build reads it: an edit here moves no hash.
#
# cpe       NVD's vendor and product (`cpe:2.3:a:<vendor>:<product>`), for
#           NVD's matches and the CPEs in CVE records
# names     other product names CVE records use for it
# repo, tag the upstream git repository and its release tag (`{version}`,
#           `{version_}` with dots as `_`): OSV's commit query
# osv       `<ecosystem>:<name>` OSV knows it by (PyPI, Go, Linux)
# version_after  the upstream version is what follows this in the
#           package's version (CEF's Chromium)
# skip      why it has nothing to match (data, a sibling's tree)
# not_affected   CVE id = why it does not apply, after triage; the audit
#           drops it until the version moves
#
# An `-i386` package is its sibling's: the same sources.

