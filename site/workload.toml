# oath.moonlight.pm: the product page and the manual (site/).
# Apply: wicketctl workload apply aulos --file site/workload.toml --confirm
#
# The id is the workload Thoxa's workloads/oath created; the site moved
# here and keeps it. oath.wicket.cloud, its first address, went when
# wicket.cloud was parked (2026-10-20); no route, no redirect.

schema = "wicket.workload/v0"

[workload]
id = "wl-b6703b0fa806"
name = "oath"

[[containers]]
name = "web"
image = "registry.wicket.cloud/oath-site:latest"
ports = [{ name = "http" }]

[[routes]]
host = "oath.moonlight.pm"
container = "web"
port = "http"
